<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="hub-title" content="Sequential Algorithm">
<meta name="hub-description" content="Sequential algorithms, pseudocode, variables, worked examples, and interactive tracing challenges.">
<meta name="hub-sections" content="26 presentation sections">
<title>ADS1 — Chapter 2 Interactive Presentation</title>
<style>
:root{
 --blue:#1f5f96;--blue2:#3d83b8;--pale:#edf5fb;--ink:#1e3345;
 --muted:#667889;--line:#d7e3ec;--white:#fff;--good:#27845b;--bad:#bd4c4c;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;background:#fff}
.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;
justify-content:space-between;padding:0 38px;background:#fff;position:sticky;top:0;z-index:5}
.brand{font-size:19px;font-weight:900;color:var(--blue);letter-spacing:.08em}
.chapter{font-size:14px;font-weight:800;letter-spacing:.13em;color:var(--muted)}
.univ{position:absolute;left:50%;transform:translateX(-50%);text-align:center;line-height:1.25;white-space:nowrap}
.univ-main{font-size:13px;font-weight:900;letter-spacing:.11em;color:var(--blue)}
.univ-faculty{font-size:9px;font-weight:700;letter-spacing:.045em;color:var(--muted);margin-top:3px}
.progress{height:4px;background:#edf2f6}.progress i{display:block;height:100%;background:var(--blue);width:5%;transition:.3s}
.layout{display:grid;grid-template-columns:150px 1fr;min-height:calc(100vh - 76px)}
.rail{border-right:1px solid var(--line);background:#fbfdff;padding:22px 12px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto}
.rail-title{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.15em;margin:0 8px 12px}
.rail button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:#738696;
padding:10px 7px;border-radius:8px;margin:2px 0;font-size:12px;font-weight:700;text-align:left}
.rail button:hover{background:var(--pale);color:var(--blue)}
.rail button.active{background:var(--blue);color:#fff}
.num{font-size:10px;min-width:25px}
.main{padding:46px 70px 32px;max-width:1250px;width:100%;margin:auto}
.chapter-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:#edf5ff;color:var(--blue);font-weight:900;font-size:12px;letter-spacing:.09em}.chapter-pill span{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan))}.kicker{color:var(--blue);font-size:12px;font-weight:900;letter-spacing:.17em;text-transform:uppercase}
h1{font-size:46px;line-height:1.06;margin:10px 0 12px;color:var(--blue)}
h2{font-size:28px;color:var(--blue);margin:8px 0 12px}
.lead{font-size:18px;line-height:1.65;color:var(--muted);max-width:900px}
.rule{height:4px;width:78px;background:var(--blue);margin:20px 0 28px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{border:1px solid var(--line);background:#fff;padding:22px;border-radius:10px}
.card h3{margin:0 0 9px;color:var(--blue);font-size:18px}
.card p{margin:0;color:var(--muted);line-height:1.55}
.step{border-left:5px solid var(--blue);background:var(--pale);padding:16px 18px;border-radius:7px;margin:10px 0;cursor:pointer}
.step:hover{background:#e5f1f9}.step strong{color:var(--blue)}
.step-detail{display:none;margin-top:9px;color:var(--muted);line-height:1.5}.step.open .step-detail{display:block}
.btn{border:1px solid var(--blue);background:#fff;color:var(--blue);padding:11px 17px;border-radius:7px;font-weight:800}
.btn:hover{background:var(--pale)}.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:#174c79}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.code{background:#f6f9fb;border:1px solid var(--line);padding:19px;border-radius:8px;
font-family:Consolas,monospace;font-size:14px;line-height:1.7;color:#243746;white-space:pre-wrap}
.memory{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.var{border:1px solid var(--line);border-radius:8px;padding:15px;text-align:center}
.var .name{font-size:13px;color:var(--muted)}.var .val{font-size:26px;font-weight:900;color:var(--blue);margin-top:6px}
.feedback{margin-top:12px;min-height:25px;font-weight:800}.good{color:var(--good)}.bad{color:var(--bad)}
.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:13px;border-radius:7px;margin:6px 0}
.choice:hover{border-color:var(--blue);background:var(--pale)}.choice.correct{background:#edf8f2;border-color:#63ad88}.choice.wrong{background:#fff0f0;border-color:#d98989}
.question{font-size:21px;font-weight:900;margin-bottom:16px}
input[type=number],input[type=text]{padding:11px;border:1px solid var(--line);border-radius:6px;width:100%;margin:6px 0 12px}
.trace{margin-top:15px}.trace-line{padding:10px 13px;border-left:3px solid #cbd9e4;margin:7px 0;color:var(--muted)}
.trace-line.on{border-color:var(--blue);background:var(--pale);color:var(--ink);font-weight:700}
.hidden{display:none!important}
.footer{border-top:1px solid var(--line);padding:15px 38px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;background:#fff}
.nav{display:flex;gap:8px}.nav button{border:1px solid var(--line);background:#fff;color:var(--blue);padding:9px 14px;border-radius:6px;font-weight:800}
.nav button:hover{background:var(--pale)}.nav button:disabled{opacity:.35;cursor:not-allowed}
.badge{display:inline-block;background:var(--pale);color:var(--blue);padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;margin:3px}
.full{position:fixed;right:20px;bottom:20px;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:50%;width:46px;height:46px;font-weight:900;z-index:10}
@media(max-width:800px){
 .layout{grid-template-columns:1fr}.rail{position:sticky;top:76px;height:auto;max-height:78px;display:flex;align-items:center;gap:8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:thin;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;background:#fff;z-index:8}.rail-title{display:none}
 #rail{display:flex;align-items:center;gap:8px;min-width:max-content}.rail button{flex:0 0 auto;min-width:48px;width:auto;min-height:44px;max-width:180px;justify-content:flex-start;scroll-snap-align:center}.rail button span:last-child{display:inline-block;max-width:105px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rail button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
 .main{padding:32px 22px}.g2,.g3{grid-template-columns:1fr}.memory{grid-template-columns:1fr}h1{font-size:36px}.top{padding:0 18px}.chapter{font-size:10px}.univ-main{font-size:10px}.univ-faculty{font-size:7px}.footer{padding:12px 18px}
}

.reveal-item{opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .45s ease,transform .45s ease}
.reveal-item.show{opacity:1;transform:translateY(0);pointer-events:auto}
.click-hint{display:inline-flex;align-items:center;gap:7px;color:var(--blue);font-size:12px;font-weight:900;margin-top:15px}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.35);opacity:1}}
.flow{display:flex;align-items:center;justify-content:center;gap:12px;margin:28px 0;flex-wrap:wrap}
.flow-box{min-width:180px;text-align:center;padding:22px 16px;border:1px solid var(--line);border-radius:10px;background:#fff}
.flow-box .icon{font-size:27px;margin-bottom:8px;color:var(--blue)}
.flow-arrow{font-size:24px;color:var(--blue);font-weight:900}
.focus-box{border:2px solid var(--blue);background:var(--pale);padding:22px;border-radius:10px}
.teacher-note{margin-top:20px;padding:11px 14px;border-left:3px solid var(--blue);background:#fbfdff;color:var(--muted);font-size:12px}
.step-number{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;background:var(--blue);color:#fff;margin-right:8px}


.show-all{margin-left:4px}
.reveal-item.show{opacity:1!important;transform:translateY(0)!important;pointer-events:auto!important}


.uni-logo{width:42px;height:42px;object-fit:contain;display:block}
.univ{display:flex!important;align-items:center;gap:10px}
.univ-text{text-align:left}
.presentation-date{font-size:12px;font-weight:800;color:var(--muted);margin:8px 0;letter-spacing:.05em}
.welcome-logo{width:92px;height:92px;object-fit:contain;margin-bottom:10px}
.slide-number{position:fixed;right:24px;bottom:16px;font-size:11px;font-weight:800;color:var(--muted);z-index:100}
.slide-progress{position:fixed;left:0;bottom:0;height:3px;background:var(--blue);z-index:101;transition:width .3s ease}


:root{
  --blue:#1261d6;
  --blue2:#2d8cff;
  --navy:#0b1f3a;
  --cyan:#20b8e6;
  --pale:#eef6ff;
  --pale2:#f6faff;
  --line:#d8e4f2;
  --text:#10233f;
  --muted:#61738d;
  --green:#18a874;
  --orange:#f59e0b;
  --shadow:0 16px 40px rgba(20,70,130,.10);
}
body{background:#fff;color:var(--text)}
.top{
  background:#fff!important;
  border-bottom:1px solid #dbe7f4!important;
  box-shadow:0 4px 18px rgba(16,56,100,.06);
}
.chapter{color:var(--navy)!important}
.brand{
  color:var(--blue)!important;
  font-weight:950!important;
  letter-spacing:.08em!important;
}
main,.slide,.content{background:#fff!important}
h1{
  color:var(--navy)!important;
  letter-spacing:-.035em;
}
h2,h3{color:var(--navy)!important}
.kicker{
  color:var(--blue)!important;
  font-weight:900!important;
  letter-spacing:.12em!important;
}
.lead{color:#50657f!important}
.rule{
  background:linear-gradient(90deg,var(--blue),var(--cyan),transparent)!important;
  height:4px!important;
  border-radius:10px!important;
}
.card,.flow-box,.focus-box,.step,.memory,.question,.feedback{
  border:1px solid var(--line)!important;
  border-radius:18px!important;
  background:#fff!important;
  box-shadow:var(--shadow)!important;
}
.card:hover,.flow-box:hover,.step:hover{
  transform:translateY(-3px);
  border-color:#a8c9f5!important;
  box-shadow:0 20px 45px rgba(18,97,214,.14)!important;
  transition:.25s ease;
}
.focus-box{
  border-left:6px solid var(--blue)!important;
  background:linear-gradient(135deg,#f8fbff,#eef6ff)!important;
}
.flow-box{
  position:relative;
  overflow:hidden;
}
.flow-box:before{
  content:"";
  position:absolute;left:0;right:0;top:0;height:5px;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
}
.flow-box:nth-child(1) .icon{color:var(--blue)}
.flow-box:nth-child(3) .icon{color:var(--cyan)}
.flow-box:nth-child(5) .icon{color:var(--green)}
.flow-arrow{
  color:var(--blue)!important;
  font-size:30px!important;
}
.btn{
  border:1px solid #b9cee8!important;
  background:#fff!important;
  color:var(--navy)!important;
  border-radius:999px!important;
  padding:11px 18px!important;
  font-weight:850!important;
  box-shadow:0 5px 14px rgba(20,70,130,.07)!important;
}
.btn:hover{
  transform:translateY(-2px);
  border-color:var(--blue)!important;
  color:var(--blue)!important;
}
.btn.primary{
  background:linear-gradient(135deg,var(--blue),var(--blue2))!important;
  color:#fff!important;
  border:none!important;
  box-shadow:0 9px 22px rgba(18,97,214,.25)!important;
}
.badge{
  background:#eaf4ff!important;
  color:var(--blue)!important;
  border:1px solid #c8def8!important;
  border-radius:999px!important;
  font-weight:850!important;
  padding:9px 14px!important;
}
.code{
  background:#0d213c!important;
  color:#eaf4ff!important;
  border:0!important;
  border-radius:18px!important;
  box-shadow:0 18px 45px rgba(8,30,60,.20)!important;
  position:relative;
}
.code:before{
  content:"PSEUDOCODE";
  display:block;
  color:#77c8ff;
  font-size:10px;
  font-weight:900;
  letter-spacing:.16em;
  margin-bottom:14px;
}
.code .show{
  color:#fff;
}
.memory{
  padding:16px!important;
  background:linear-gradient(180deg,#fbfdff,#f1f7ff)!important;
}
.var{
  background:#fff!important;
  border:1px solid #d5e4f5!important;
  border-radius:14px!important;
  box-shadow:0 6px 18px rgba(20,70,130,.06)!important;
}
.var .name{color:var(--navy)!important;font-weight:850}
.var .val{
  color:var(--blue)!important;
  font-weight:950!important;
}
.step-number{
  background:linear-gradient(135deg,var(--blue),var(--cyan))!important;
  box-shadow:0 6px 14px rgba(18,97,214,.22);
}
.teacher-note{
  border-left:4px solid var(--cyan)!important;
  background:#f5fbff!important;
  border-radius:0 12px 12px 0;
}
.click-hint{color:var(--blue)!important}
.pulse-dot{background:var(--cyan)!important}
.slide-number{color:var(--navy)!important}
.slide-progress{
  background:linear-gradient(90deg,var(--blue),var(--cyan))!important;
}
input{
  border:1px solid #cbdced!important;
  border-radius:10px!important;
  padding:10px!important;
}
input:focus{
  outline:3px solid rgba(45,140,255,.15);
  border-color:var(--blue)!important;
}

html[data-ads1-theme="dark"] .nav button,
html[data-ads1-theme="dark"] .full{background:#172a40!important;color:#e7effb!important;border-color:#33475f!important}

html[data-ads1-theme="dark"] .good{color:#8de0b3!important}

html[data-ads1-theme="dark"] .progress{background:#172a40!important}
</style>

["Definition",`<div class="kicker">Concept</div><h1>What is a Sequential Algorithm?</h1><div class="rule"></div><div class="card"><p style="font-size:21px;color:var(--ink)">A sequential algorithm is an algorithm where instructions are executed <b>one after another</b>, in the exact order they are written.</p><p style="margin-top:14px">Each step depends on the previous one. There is no branching or repetition in the basic sequential structure.</p></div>
<div class="grid g3" style="margin-top:20px"><div class="card"><h3>01</h3><p>First instruction</p></div><div class="card"><h3>02</h3><p>Second instruction</p></div><div class="card"><h3>03</h3><p>Third instruction</p></div></div>`],
["Execution",`<div class="kicker">Visualise the idea</div><h1>One Instruction at a Time</h1><div class="rule"></div>
<div class="focus-box"><div class="question" style="margin-bottom:6px">What happens first?</div><p style="margin:0;color:var(--muted)">A sequential algorithm does not jump. It moves from one instruction to the next.</p></div>
<div id="execSteps" style="margin-top:20px">
<div class="step reveal-item"><strong>① Read the first value</strong><div class="step-detail">The algorithm receives its first input.</div></div>
<div class="step reveal-item"><strong>② Read the second value</strong><div class="step-detail">The algorithm receives the next input.</div></div>
<div class="step reveal-item"><strong>③ Calculate</strong><div class="step-detail">The processing instruction is executed.</div></div>

let page=0, counter=5;

function revealFlow(){
  const ids=["flow1","arrow1","flow2","arrow2","flow3"];
  const next=ids.find(id=>!document.getElementById(id)?.classList.contains("show"));
  if(next) document.getElementById(next).classList.add("show");
}
let methodStep=0;
function revealMethod(){
  methodStep=Math.min(6,methodStep+1);
  const e=document.getElementById("method"+methodStep);
  if(e){e.classList.add("show"); e.classList.add("open");}
}
let pseudoStep=0;
function revealPseudo(){
  pseudoStep=Math.min(8,pseudoStep+1);
  const e=document.getElementById("p"+pseudoStep);
  if(e)e.classList.add("show");
}
let varStep=1;
function revealVars(){
  varStep++;
  const e=document.getElementById("var"+varStep);
  if(e)e.classList.add("show");
}
let execStep=0;
function revealExec(){
  execStep++;
  const items=document.querySelectorAll("#execSteps .reveal-item");
  if(items[execStep-1]){items[execStep-1].classList.add("show");items[execStep-1].classList.add("open")}
}


function forceReveal(id){
  const e=document.getElementById(id);
  if(e)e.classList.add("show");
}
function showAllBMI(){
  forceReveal("bmiFormula"); forceReveal("bmiInputs");
}
function showAllVars(){
  ["var2","var3"].forEach(forceReveal);
}
function showAllPseudo(){
  for(let i=1;i<=8;i++)forceReveal("p"+i);
  pseudoStep=8;
}
function showAllFlow(){
  ["flow1","arrow1","flow2","arrow2","flow3","ipoDemo"].forEach(forceReveal);
}


function checkPredict(btn, ans){
  document.querySelectorAll(".question .btn").forEach(b=>b.classList.remove("primary"));
  btn.classList.add("primary");
  const f=document.getElementById("predictFeedback");
  if(ans==="B"){f.innerHTML="✓ Correct! Execute each assignment in order: x becomes 7, then b becomes 5."; f.style.color="var(--green)";}
  else {f.innerHTML="Not quite. Follow the assignments one by one and recalculate after each instruction."; f.style.color="var(--orange)";}
}
let traceStep=0;
function nextTrace(){
  const vals=[5,8,16];
  const lines=["traceLine1","traceLine2","traceLine3"];
  if(traceStep<3){
    document.getElementById(lines[traceStep]).classList.add("show");
    document.getElementById("traceX").textContent=vals[traceStep];
    document.getElementById("traceFeedback").textContent =
      traceStep===0 ? "Instruction 1: x starts at 5." :
      traceStep===1 ? "Instruction 2: x becomes 5 + 3 = 8." :
      "Instruction 3: x becomes 8 × 2 = 16.";
    traceStep++;
  }
}
function resetTrace(){
  traceStep=0; document.getElementById("traceX").textContent="?";
  ["traceLine2","traceLine3"].forEach(id=>document.getElementById(id).classList.remove("show"));
  document.getElementById("traceFeedback").textContent="Start with x = ?";
}
function showError(){
  document.getElementById("errorFeedback").innerHTML="🚨 <strong>WRITE(A)</strong> appears before A has been calculated.";
}
function fixError(){
  document.getElementById("errorFeedback").innerHTML="✓ Correct order: READ(L) → READ(W) → A ← L × W → WRITE(A).";
}
let buildOrder=[];
function buildPick(i){
  buildOrder.push(i);
  const correct=[1,3,2,0];
  const f=document.getElementById("buildFeedback");
  if(buildOrder.length<=correct.length && buildOrder[buildOrder.length-1]===correct[buildOrder.length-1]){
    f.innerHTML="✓ Good. Step "+buildOrder.length+" is correct.";
    if(buildOrder.length===4) f.innerHTML="🎉 Perfect! You built the sequence correctly.";
  } else {
    f.innerHTML="Try again: think INPUT → PROCESSING → OUTPUT.";
    buildOrder=[];
  }
}
function showBuildSolution(){
  document.getElementById("buildFeedback").innerHTML="ALGORITHM Sum;<br>VAR: a, b, sum : REAL;<br>BEGIN<br>&nbsp;&nbsp;READ(a);<br>&nbsp;&nbsp;READ(b);<br>&nbsp;&nbsp;sum ← a + b;<br>&nbsp;&nbsp;WRITE(sum);<br>END;";
}
function detective(ans){
  const f=document.getElementById("detectiveFeedback");
  f.innerHTML=ans==="A" ? "✓ Correct! The data is read first, then processed, then displayed." : "✗ Check the IPO order: Input must come before Processing, and Processing before Output.";
}
function showMiniSolution(){document.getElementById("miniSolution").classList.add("show")}
function toggleAnswer(id){document.getElementById(id).classList.toggle("show")}

function render(){
 const s=slides[page], screen=document.getElementById("screen");
 screen.innerHTML=s[1];
 document.getElementById("counter").textContent=String(page+1).padStart(2,"0")+" / "+String(slides.length).padStart(2,"0");
 document.getElementById("progress").style.width=((page+1)/slides.length*100)+"%";
 document.getElementById("rail").innerHTML=slides.map((x,i)=>`<button class="${i===page?'active':''}" onclick="go(${i})"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${x[0]}</span></button>`).join("");
 document.getElementById("prev").disabled=page===0; document.getElementById("next").disabled=page===slides.length-1;
  const total = slides.length;
  const shown = page + 1;
  const sn = document.getElementById("slideNumber");
  const sp = document.getElementById("slideProgress");
  if(sn) sn.textContent = String(shown).padStart(2,"0")+" / "+String(total).padStart(2,"0");
  if(sp) sp.style.width = ((shown/total)*100)+"%";

}
function go(i){page=Math.max(0,Math.min(slides.length-1,i));render();window.scrollTo({top:0,behavior:"smooth"})}
function reveal(id){
 const e=document.getElementById(id);
 if(!e)return;
 if(e.classList.contains("reveal-item")) e.classList.add("show");
 else e.classList.toggle("hidden");
}
function toggleStep(el){el.classList.toggle("open")}
function answer(btn,ok,id){btn.classList.add(ok?"correct":"wrong");document.getElementById(id).textContent=ok?"Correct!":"Try again.";document.getElementById(id).className="feedback "+(ok?"good":"bad")}
function runBMI(){let w=+document.getElementById("w").value,h=+document.getElementById("h").value;if(w<=0||h<=0)return;let bmi=w/(h*h);document.getElementById("mw").textContent=w.toFixed(1);document.getElementById("mh").textContent=h.toFixed(2);document.getElementById("mb").textContent=bmi.toFixed(2);document.getElementById("bmiMsg").textContent="BMI = "+bmi.toFixed(2);document.getElementById("bmiMsg").className="feedback good"}
function trace(){let box=document.getElementById("traceBox");box.innerHTML="";["ALGORITHM Calculate_BMI;","VAR: weight, height, bmi : REAL;","READ(weight);","READ(height);","bmi ← weight / (height × height);","WRITE(bmi);","END;"].forEach((x,i)=>setTimeout(()=>{let d=document.createElement("div");d.className="trace-line on";d.textContent="Step "+(i+1)+" → "+x;box.appendChild(d)},i*550))}
function changeVars(){document.getElementById("v1").textContent=document.getElementById("v1").textContent==="70"?"75":"70";document.getElementById("v2").textContent=document.getElementById("v2").textContent==="1.75"?"1.80":"1.75";document.getElementById("v3").textContent="updated"}
function constantTest(){let e=document.getElementById("constMsg");e.textContent="A constant cannot be changed during execution.";e.className="feedback bad"}
function ops(){let a=+document.getElementById("a").value,b=+document.getElementById("b").value;document.getElementById("opMsg").textContent=`a+b=${a+b} · a-b=${a-b} · a*b=${a*b} · a/b=${b?(a/b).toFixed(2):"undefined"} · a%b=${b?a%b:"undefined"}`}
function changeCounter(n){counter+=n;document.getElementById("counterVal").textContent=counter}
function escapeOut(){document.getElementById("escOut").textContent=document.getElementById("esc").value.replaceAll("\\n","\n").replaceAll("\\t","\t").replaceAll('\\"','"')}
document.getElementById("prev").onclick=()=>go(page-1);document.getElementById("next").onclick=()=>go(page+1);
document.getElementById("full").onclick=()=>document.documentElement.requestFullscreen?.();
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(page+1);if(e.key==="ArrowLeft")go(page-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1)});
render();
</script>
<div id="slideNumber" class="slide-number">01 / 01</div><div id="slideProgress" class="slide-progress" style="width:0%"></div><script>
window.addEventListener("message", event => {
  if (event.source !== parent || !event.data || event.data.type !== "ADS1_THEME") return;
  document.documentElement.dataset.ads1Theme = event.data.theme === "dark" ? "dark" : "light";
});
</script>
